ReleaseNotes: |-
  The second half of the screen-by-screen audit. Nineteen fixes, every one driven on real hardware
  and judged by reading the disk afterwards rather than the dialog. Nothing is added and nothing
  moves: updating is safe from any 4.x, and no file format or saved setting changes.

  Two of these could have cost someone data. The scheduled clone's startup offer matched a drive by
  model name alone and took the first hit, so with a 1 GB drive scheduled it announced a 32 MB one as
  "the drive your scheduled clone writes to" and offered to erase it. Behind the unattended run, the
  size test had a flat one-gibibyte tolerance - wide enough that the same 32 MB disk passed for the
  1 GB one and the headless run took it as its target. Both paths now ask the same question in the
  same place, with a tolerance of one percent, and the offer stays quiet when it cannot be certain.

  The DllNotFoundException reported on 4.5.0 is fixed. A single-file .exe unpacks part of itself into
  the temporary folder and runs from there; "Clean traces" was clearing that out, and the next
  shutdown threw. It would have happened on every clean. The sweep now leaves that folder alone for
  any single-file program on the PC, not only this one. Reported by Keith Weisshar. A fault that
  arrives while the app is closing also goes to the log now, instead of a dialog claiming an
  operation was lost.

  Duplicate files: two names for one file were offered as two copies, and deleting either frees
  nothing. The protected folder now counts even if you choose it after the scan, where it used to
  tick your master copy red and keep a different one.

  Resize and Delete asked diskpart, which on a virtual disk reports no free space and then refuses -
  while Windows' own partition API does both. They ask Windows first now, and a refusal is no longer
  reported as a crash. Secure-deleting a single file gained the three guards the folder shredder
  already had. Building a drive no longer leaves the host machine's disk policy rewritten, and
  Windows-To-Go reads its options before writing the image rather than after.

  Stop told every operation the same story about a USB - including a backup into a file and a
  read-only surface test. It names the operation it is about to stop now.

