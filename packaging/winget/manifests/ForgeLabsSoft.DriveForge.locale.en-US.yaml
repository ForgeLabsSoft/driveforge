ReleaseNotes: |-
  Fixed: the same fault behind 4.4.3 was still in four more places, and one of them was the tool for
  recovering from it.

  Quick partition, Convert MBR/GPT and "Initialize a blank / RAW disk" all emptied the disk and then asked
  Windows to convert a partition table that no longer existed, which fails on Windows 11 26H2 and leaves the
  drive blank. Quick format had the quiet version of it: it created a partition without asking for a table at
  all, and Windows then makes an MBR one, so a 4 TB drive came back as a 2 TB volume and the operation
  reported success.

  All four now create the partition table with the call meant for a blank disk and check that they got it.
  Two build-breaking rules were added so the pattern cannot return, and both were confirmed by deliberately
  breaking the code.

  Verified on real hardware as well as in tests, including driving the application itself through the repair
  on a USB-attached SSD, in both directions.
