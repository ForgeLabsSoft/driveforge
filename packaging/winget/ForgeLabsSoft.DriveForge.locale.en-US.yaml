ShortDescription: Create Windows USB drives, clone this PC, back it up, and check drive health — free, portable, offline.
Description: |-
  DriveForge is a free, open-source Windows utility for everything you would otherwise need several tools for.

  - Create a bootable Windows USB from an ISO, with optional bypasses for the Windows 11 requirements and the
    Microsoft-account prompt.
  - Clone this PC to a portable drive that boots on any machine, or to another internal disk.
  - Back this PC up to a .wim image and restore it to a drive later, or export it as a Hyper-V VHDX.
  - Recover deleted files (NTFS/exFAT/FAT), securely erase files or free space, and write any Linux ISO.
  - Check drive health and speed, test a drive's real capacity, and boot-test a drive in a virtual machine
    without rebooting your PC.

  It is one self-contained executable with no installer. No ads, no telemetry, no accounts: nothing about you
  is collected or sent anywhere, and the core features work with no internet connection.

  DriveForge is not code-signed, so Windows SmartScreen warns on first run. Every release is built from the
  public source by GitHub Actions and carries a build-provenance attestation that anyone can verify with
  "gh attestation verify DriveForge.exe --repo ForgeLabsSoft/driveforge".
