ReleaseNotes: |-
  Write one image to several drives one after another, and everything that running every function against real
  hardware found and fixed: bcdboot failures are explained in all five flows that write a bootloader, a restore
  no longer ends by announcing "USB creation finished", the progress row no longer follows a finished operation
  around the app, and the multi-boot picker marks the disks in its list that are not removable drives.
