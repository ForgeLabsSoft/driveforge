name: build

# Builds DriveForge.exe from source on a clean GitHub-hosted Windows runner.
# This gives SignPath (and anyone) a verifiable, reproducible build from the public
# source. On a version tag (vX.Y.Z) it also publishes a GitHub Release with the exe
# and its SHA-256. Code signing (SignPath) will be added as a step here once approved.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write      # needed only to create a Release on a version tag
  id-token: write      # for build-provenance attestation
  attestations: write  # for build-provenance attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # A version tag is a claim about what the binary will say about itself, and nothing enforced it. The
      # version is hand-written in Properties/AssemblyInfo.cs - GenerateAssemblyInfo is False, so the SDK
      # generates none of it - which means tagging v4.5.0 without editing that file publishes an exe whose
      # properties still read 4.4.0.0. That number is not cosmetic: it is what Explorer shows, what winget
      # and Scoop report, and what every scanner prints in its file-version block, so the wrong one is wrong
      # everywhere at once and cannot be corrected without re-cutting the release.
      #
      # Placed before the SDK and the tests on the same reasoning as the comment below: the job stops at the
      # first red step, so a mismatched tag costs a few seconds here instead of a published release. The tag
      # arrives through env rather than inline ${{ }} so its text is never pasted into the script body.
      - name: Check the tag matches AssemblyInfo (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $file = 'Properties/AssemblyInfo.cs'
          $src = Get-Content $file -Raw
          $tag = $env:TAG -replace '^v', ''

          # AssemblyVersion and AssemblyFileVersion are four-part; a tag is normally three. Pad both to four
          # so v4.4.0 and 4.4.0.0 compare equal, and drop any -rc/+build suffix before the numeric compare.
          function Norm([string]$v) {
            $p = @(($v -split '[-+]')[0].Split('.'))
            while ($p.Count -lt 4) { $p += '0' }
            ($p[0..3]) -join '.'
          }
          function Attr([string]$name) {
            $m = [regex]::Match($src, "\[assembly:\s*$name\(""([^""]*)""\)\]")
            if (-not $m.Success) { throw "$name not found in $file" }
            $m.Groups[1].Value
          }

          $want = Norm $tag
          $bad = @()
          foreach ($a in 'AssemblyFileVersion', 'AssemblyVersion') {
            $got = Attr $a
            if ((Norm $got) -ne $want) { $bad += "$a is $got - the tag says $tag" }
          }
          # The informational version is the one humans read, so it must equal the tag exactly, suffix and
          # all: v4.5.0-rc1 must not ship as plain 4.5.0.
          $info = Attr 'AssemblyInformationalVersion'
          if ($info -ne $tag) { $bad += "AssemblyInformationalVersion is $info - the tag says $tag" }

          if ($bad.Count) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw "$file does not match tag $env:TAG. Edit it, commit, then move the tag onto that commit."
          }
          Write-Host "AssemblyInfo matches $($env:TAG): file=$(Attr 'AssemblyFileVersion') assembly=$(Attr 'AssemblyVersion') informational=$info"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Verification runs BEFORE the build/publish steps on purpose: GitHub Actions stops the job at the first
      # failing step, so a red test blocks Restore, Publish, Attest AND the release step below. A broken build can
      # therefore no longer be tagged into a release.
      #
      # The explicit project path is required. `dotnet test` at the repo root (there is no .sln) picks up
      # DriveForge.csproj, runs ZERO tests and exits 0 — a silent false green that looks like passing CI.
      - name: Run tests (unit + localization + code invariants)
        run: >
          dotnet test tests/DriveForge.Tests/DriveForge.Tests.csproj
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # always() so the .trx is available precisely when tests FAILED. This is the only step that may ignore the
      # job status — never put continue-on-error on the test step itself, that reintroduces the false green.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Restore
        run: dotnet restore DriveForge.csproj

      - name: Publish (self-contained single file, win-x64)
        run: >
          dotnet publish DriveForge.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Stage DriveForge.exe + checksum
        shell: pwsh
        run: |
          $src = "bin/Release/net10.0-windows/win-x64/publish/DriveForge.exe"
          if (-not (Test-Path $src)) { throw "Build output not found: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src dist/DriveForge.exe
          $hash = (Get-FileHash dist/DriveForge.exe -Algorithm SHA256).Hash
          "$hash  DriveForge.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $mb = [math]::Round((Get-Item dist/DriveForge.exe).Length / 1MB, 1)
          Write-Host "DriveForge.exe = $mb MB, SHA-256 = $hash"

      - name: Attest build provenance (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/DriveForge.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriveForge
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lead the notes with the logo, pinned to THIS tag: an older release then keeps the artwork it
          # shipped with instead of silently picking up a later one. The square logo, not the wide banner:
          # the banner renders about 310px on a phone, where its inner captions become unreadable. Markdown
          # rather than <img>, because markdown is certain to render wherever the body is shown.
          $logo = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/logo-256.png"
          $header = "![DriveForge]($logo)`r`n`r`n"
          # Only this version's section goes in the notes - the whole file made every release page repeat the
          # entire history below the part anyone came to read. The regex runs from this tag's heading to the next
          # '## v' heading. If it does not match (a heading renamed, a tag cut before its section was written) the
          # whole changelog is used instead: too much is recoverable, empty notes are not.
          $tag = "${{ github.ref_name }}"
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $pattern = "(?ms)^## " + [regex]::Escape($tag) + " .*?(?=^## v|\z)"
            $m = [regex]::Match($raw, $pattern)
            if ($m.Success) {
              $section = $m.Value.TrimEnd()
              $full = "https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md"
              $section = $section + "`r`n`r`n---`r`n`r`n[Full changelog]($full)"
            } else {
              Write-Host "::warning::no CHANGELOG section matched $tag - falling back to the whole file"
              $section = $raw
            }
          } else {
            $section = "Automated build from source on GitHub Actions. Verify the SHA-256 in SHA256SUMS.txt, and the build provenance with 'gh attestation verify DriveForge.exe --repo ForgeLabsSoft/driveforge'."
          }
          $body = $header + $section
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          gh release create ${{ github.ref_name }} dist/DriveForge.exe dist/SHA256SUMS.txt --title "DriveForge ${{ github.ref_name }}" --notes-file release-notes.md
